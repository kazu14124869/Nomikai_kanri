
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飲み会参加メンバー管理表</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: #f3f5f8;
  color: #273142;
  font-family: sans-serif;
}
.container { max-width: 850px; margin: auto; }
h1 { font-size: 22px; margin: 8px 0 18px; }
h2 { font-size: 17px; margin: 0 0 12px; }
.card {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 14px;
  box-shadow: 0 2px 7px #0000000c;
}
input, select, button {
  font: inherit;
  padding: 10px;
  border-radius: 7px;
  border: 1px solid #d5dbe3;
}
input, select { width: 100%; background: white; }
button {
  border: none;
  background: #2866c7;
  color: white;
  cursor: pointer;
}
button:active { opacity: .75; }
button.gray { background: #64748b; }
button.red { background: #dc5555; }
button.small { padding: 7px 10px; font-size: 12px; }
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.full { grid-column: 1 / -1; }
label {
  display: block;
  font-size: 12px;
  color: #64748b;
  margin-bottom: 5px;
}
.add-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.add-row input { flex: 1; min-width: 0; }
.event-item {
  padding: 12px;
  border: 1px solid #e0e5ec;
  border-radius: 9px;
  margin-bottom: 8px;
  cursor: pointer;
}
.event-item.active {
  border: 2px solid #2866c7;
  background: #f0f6ff;
}
.event-name { font-weight: bold; }
.event-date { font-size: 12px; color: #64748b; margin-top: 4px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat {
  text-align: center;
  padding: 12px 5px;
  background: #f3f6fa;
  border-radius: 9px;
}
.stat strong { display: block; font-size: 22px; }
.stat span { font-size: 11px; color: #64748b; }
.person {
  border: 1px solid #e2e7ed;
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 9px;
}
.person-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  gap: 8px;
}
.person-name { font-weight: bold; }
.person-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}
.person-grid label { margin-bottom: 5px; }
.status-yes { color: #16834a; }
.status-no { color: #d34c4c; }
.status-pending { color: #c08316; }
.section-title {
  font-size: 14px;
  font-weight: bold;
  margin: 18px 0 9px;
}
.empty { color: #929baa; font-size: 13px; padding: 10px 0; }
.hidden { display: none; }
@media(max-width:520px) {
  body { padding: 10px; }
  .person-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .full { grid-column: auto; }
}
</style>
</head>
<body>
<div class="container">

<h1>🍻 飲み会参加メンバー管理表</h1>

<div class="card">
  <h2>飲み会を新規作成</h2>
  <div class="form-grid">
    <div class="full">
      <label>飲み会タイトル</label>
      <input id="newTitle" placeholder="例：忘年会・班長会飲み会">
    </div>
    <div>
      <label>開催日</label>
      <input id="newDate" type="date">
    </div>
    <div style="display:flex;align-items:end">
      <button style="width:100%" onclick="createEvent()">＋ 飲み会を追加</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>飲み会一覧</h2>
  <div id="eventList"></div>
</div>

<div id="management" class="hidden">

  <div class="card">
    <h2 id="eventHeading">飲み会詳細</h2>
    <div class="form-grid">
      <div>
        <label>タイトル</label>
        <input id="editTitle" onchange="updateEvent()">
      </div>
      <div>
        <label>開催日</label>
        <input id="editDate" type="date" onchange="updateEvent()">
      </div>
    </div>
    <div style="margin-top:12px">
      <button class="red small" onclick="deleteEvent()">この飲み会を削除</button>
    </div>
  </div>

  <div class="card">
    <h2>参加メンバー追加</h2>
    <div class="add-row">
      <input id="personInput" placeholder="メンバーの名前">
      <button onclick="addPerson()">追加</button>
    </div>
  </div>

  <div class="card">
    <h2>参加状況</h2>
    <div class="stats">
      <div class="stat">
        <strong id="count1">0</strong>
        <span>一次会参加</span>
      </div>
      <div class="stat">
        <strong id="count2">0</strong>
        <span>二次会参加</span>
      </div>
      <div class="stat">
        <strong id="countMoney">0</strong>
        <span>会費徴収済</span>
      </div>
    </div>

    <div id="memberList"></div>
  </div>

  <div class="card">
    <h2>参加状況別リスト</h2>
    <div id="summary"></div>
  </div>

</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("nomikaiData") || "[]");
let selectedId = null;

const save = () => {
  localStorage.setItem("nomikaiData", JSON.stringify(data));
};

const current = () => data.find(e => e.id === selectedId);

function createEvent() {
  const title = document.getElementById("newTitle").value.trim();
  const date = document.getElementById("newDate").value;

  if (!title || !date) {
    alert("タイトルと開催日を入力してください");
    return;
  }

  const event = {
    id: Date.now(),
    title,
    date,
    members: []
  };

  data.push(event);
  selectedId = event.id;
  save();

  document.getElementById("newTitle").value = "";
  render();
}

function selectEvent(id) {
  selectedId = id;
  render();
}

function deleteEvent() {
  if (!confirm("この飲み会を削除しますか？")) return;

  data = data.filter(e => e.id !== selectedId);
  selectedId = null;
  save();
  render();
}

function updateEvent() {
  const e = current();
  if (!e) return;

  e.title = document.getElementById("editTitle").value;
  e.date = document.getElementById("editDate").value;
  save();
  renderEvents();
  document.getElementById("eventHeading").textContent = e.title;
}

function addPerson() {
  const e = current();
  const input = document.getElementById("personInput");
  const name = input.value.trim();

  if (!name || !e) return;

  e.members.push({
    id: Date.now() + Math.random(),
    name,
    first: "未定",
    second: "未定",
    money: "未徴収"
  });

  input.value = "";
  save();
  render();
}

function updateMember(id, key, value) {
  const e = current();
  const m = e.members.find(p => p.id === id);
  if (!m) return;

  m[key] = value;
  save();
  render();
}

function deleteMember(id) {
  const e = current();
  if (!confirm("このメンバーを削除しますか？")) return;

  e.members = e.members.filter(p => p.id !== id);
  save();
  render();
}

function renderEvents() {
  const list = document.getElementById("eventList");

  if (!data.length) {
    list.innerHTML = '<div class="empty">飲み会はまだ登録されていません。</div>';
    return;
  }

  list.innerHTML = data.map(e => `
    <div class="event-item ${e.id === selectedId ? "active" : ""}"
      onclick="selectEvent(${e.id})">
      <div class="event-name">${escapeHTML(e.title)}</div>
      <div class="event-date">
        ${e.date} ／ メンバー ${e.members.length}人
      </div>
    </div>
  `).join("");
}

function renderMembers() {
  const e = current();
  if (!e) return;

  document.getElementById("eventHeading").textContent = e.title;
  document.getElementById("editTitle").value = e.title;
  document.getElementById("editDate").value = e.date;

  const members = e.members;

  document.getElementById("count1").textContent =
    members.filter(m => m.first === "参加").length;

  document.getElementById("count2").textContent =
    members.filter(m => m.second === "参加").length;

  document.getElementById("countMoney").textContent =
    members.filter(m => m.money === "徴収済").length;

  const list = document.getElementById("memberList");

  if (!members.length) {
    list.innerHTML = '<div class="empty">メンバーを追加してください。</div>';
  } else {
    list.innerHTML = members.map(m => `
      <div class="person">
        <div class="person-top">
          <span class="person-name">${escapeHTML(m.name)}</span>
          <button class="red small"
            onclick="deleteMember(${m.id})">削除</button>
        </div>
        <div class="person-grid">
          <div>
            <label>一次会</label>
            <select onchange="updateMember(${m.id},'first',this.value)">
              ${options(["参加","不参加","未定"],m.first)}
            </select>
          </div>
          <div>
            <label>二次会</label>
            <select onchange="updateMember(${m.id},'second',this.value)">
              ${options(["参加","不参加","未定"],m.second)}
            </select>
          </div>
          <div>
            <label>会費徴収</label>
            <select onchange="updateMember(${m.id},'money',this.value)">
              ${options(["未徴収","徴収済","対象外"],m.money)}
            </select>
          </div>
        </div>
      </div>
    `).join("");
  }

  renderSummary(members);
}

function options(items, selected) {
  return items.map(v =>
    `<option value="${v}" ${v === selected ? "selected" : ""}>${v}</option>`
  ).join("");
}

function renderSummary(members) {
  const summary = document.getElementById("summary");

  const groups = [
    ["一次会参加", "first", "参加"],
    ["一次会不参加", "first", "不参加"],
    ["一次会未定", "first", "未定"],
    ["二次会参加", "second", "参加"],
    ["二次会不参加", "second", "不参加"],
    ["二次会未定", "second", "未定"],
    ["会費未徴収", "money", "未徴収"]
  ];

  summary.innerHTML = groups.map(([title,key,value]) => {
    const names = members
      .filter(m => m[key] === value)
      .map(m => escapeHTML(m.name));

    return `
      <div class="section-title">${title}（${names.length}人）</div>
      <div class="empty">
        ${names.length ? names.join("、") : "該当者なし"}
      </div>
    `;
  }).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function render() {
  renderEvents();

  const e = current();
  document.getElementById("management").classList.toggle("hidden", !e);

  if (e) renderMembers();
}

render();
</script>
</body>
</html>
